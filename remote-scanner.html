<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Remote Scanner - Zeon Opera SFT</title>
    <meta name="description" content="Use your smartphone as a remote scanner for the Zeon Opera SFT Paper Management System.">
    <meta name="author" content="Zeon Opera Horana">
    <meta name="robots" content="noindex, nofollow">
    
    <!-- CSS System -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Google Fonts: Roboto & Material Symbols Rounded -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    
    <!-- Supabase & HTML5 QR Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <!-- Tailwind Config for adaptive layouts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                    },
                    colors: {
                        m3: {
                            primary: '#80DCA0',
                            onPrimary: '#00391E',
                            primaryContainer: '#00522E',
                            onPrimaryContainer: '#9CF9BA',
                            secondary: '#B4CCB7',
                            onSecondary: '#203525',
                            secondaryContainer: '#364B3B',
                            onSecondaryContainer: '#D0E8D2',
                            tertiary: '#A1CFD2',
                            onTertiary: '#00373A',
                            tertiaryContainer: '#1E4E51',
                            onTertiaryContainer: '#BCEBEE',
                            background: '#191C19',
                            onBackground: '#E1E3DF',
                            surface: '#121412',
                            onSurface: '#E1E3DF',
                            surfaceVariant: '#414942',
                            onSurfaceVariant: '#C1C8C1',
                            outline: '#8B938B',
                            error: '#FFB4AB',
                            onError: '#690005'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased bg-m3-background text-m3-onBackground min-h-screen flex flex-col justify-center items-center px-4 py-8">
    <div class="w-full max-w-md flex flex-col gap-6">
        <!-- Main Card Container -->
        <div class="m3-card m3-card-elevated border border-m3-outline/10 p-6 sm:p-8 flex flex-col items-center">
            
            <!-- Header Section -->
            <div class="header text-center mb-6 flex flex-col items-center">
                <!-- MiniLogo.png tall vertical preservation -->
                <img src="MiniLogo.png" alt="Logo" class="h-16 w-auto object-contain mb-4 filter drop-shadow-[0_0_12px_rgba(128,220,160,0.25)]">
                <h2 class="text-2xl font-bold text-m3-primary tracking-wide">Remote Scanner</h2>
                <p id="instructor-name" class="text-sm text-m3-onSurfaceVariant mt-1 transition-all">Connecting to PC / සම්බන්ධ වෙමින්...</p>
            </div>

            <!-- QR Reader Box -->
            <div class="w-full overflow-hidden rounded-2xl border-2 border-m3-primary/30 bg-m3-surfaceVariant/10 aspect-square flex items-center justify-center relative">
                <div id="reader" class="w-full h-full"></div>
            </div>
            
            <!-- Connection Status -->
            <div class="status text-m3-onSurfaceVariant text-sm flex items-center justify-center gap-2 mt-6 select-none bg-m3-surfaceVariant/20 px-4 py-2 rounded-full border border-m3-outline/10" id="connection-status">
                <span class="material-symbols-rounded animate-spin text-m3-onSurfaceVariant text-lg">autorenew</span>
                <span>Initializing Realtime...</span>
            </div>

            <!-- Action Buttons -->
            <button id="start-btn" class="m3-btn m3-btn-filled w-full ripple-target flex items-center justify-center gap-2 mt-6 h-12" onclick="startRemoteScanner()">
                <span class="material-symbols-rounded">photo_camera</span>
                <span>Start Camera</span>
            </button>
            
            <button id="stop-btn" class="m3-btn m3-btn-filled bg-m3-error text-m3-onError hover:bg-m3-error/90 w-full ripple-target flex items-center justify-center gap-2 mt-6 h-12 d-none" onclick="stopRemoteScanner()">
                <span class="material-symbols-rounded">videocam_off</span>
                <span>Stop Camera</span>
            </button>
        </div>
    </div>

    <!-- M3 Styled Toast -->
    <div id="toast" class="toast">
        <span class="material-symbols-rounded">info</span>
        <span id="toast-msg">Message</span>
    </div>

    <script src="js/supabase-config.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const instructorId = urlParams.get('id');
        let html5QrCode = null;
        let channel = null;
        let isProcessing = false;

        if (!instructorId) {
            alert("No instructor ID provided. Use the QR code from the PC dashboard.");
            window.close();
        }

        // Initialize Realtime Channel
        channel = supabaseClient.channel(`scanner:${instructorId}`, {
            config: { broadcast: { self: true } }
        });

        channel
            .on('broadcast', { event: 'ping' }, () => {
                showToast("PC Connected!");
            })
            .subscribe((status) => {
                if (status === 'SUBSCRIBED') {
                    document.getElementById('connection-status').innerHTML = `
                        <span class="material-symbols-rounded text-m3-primary text-lg icon-filled">check_circle</span>
                        <span>Ready to scan</span>
                    `;
                    document.getElementById('instructor-name').innerText = "Connected to PC";
                    // Send join message
                    channel.send({ type: 'broadcast', event: 'join', payload: { device: 'phone' } });
                }
            });

        function startRemoteScanner() {
            document.getElementById('start-btn').classList.add('d-none');
            document.getElementById('stop-btn').classList.remove('d-none');
            
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    if (isProcessing) return;
                    isProcessing = true;
                    
                    // Vibrate
                    if (navigator.vibrate) navigator.vibrate(100);
                    
                    // Send to PC
                    channel.send({
                        type: 'broadcast',
                        event: 'scan',
                        payload: { classId: decodedText }
                    });

                    showToast(`Sent: ${decodedText}`);

                    // Throttle scans
                    setTimeout(() => { isProcessing = false; }, 2000);
                },
                (errorMessage) => {}
            ).catch(err => {
                showToast("Camera error: " + err, "error");
                stopRemoteScanner();
            });
        }

        function stopRemoteScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('start-btn').classList.remove('d-none');
                    document.getElementById('stop-btn').classList.add('d-none');
                }).catch(err => console.log(err));
            }
        }
    </script>
</body>
</html>
